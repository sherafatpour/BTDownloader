plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp'
    id 'maven-publish'
}

android {
    namespace = 'com.ketch'
    compileSdk = 36

    defaultConfig {
        minSdk = 23

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = project.findProperty('GROUP') ?: 'com.github.BluetileTeam.uturn-android-ketch'
                artifactId = project.findProperty('POM_ARTIFACT_ID') ?: 'ketch'
                version = project.findProperty('VERSION_NAME') ?: '2.1.0'

                pom {
                    name = 'Ketch'
                    description = 'Android download manager library built on WorkManager, Room, Retrofit, and Flow.'
                    url = 'https://github.com/BluetileTeam/uturn-android-ketch'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }
                    developers {
                        developer {
                            id = 'BluetileTeam'
                            name = 'BluetileTeam'
                        }
                    }
                    scm {
                        connection = 'scm:git:git://github.com/BluetileTeam/uturn-android-ketch.git'
                        developerConnection = 'scm:git:ssh://github.com/BluetileTeam/uturn-android-ketch.git'
                        url = 'https://github.com/BluetileTeam/uturn-android-ketch'
                    }
                }
            }
        }
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.17.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation "androidx.work:work-runtime-ktx:2.11.2"
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation("androidx.room:room-runtime:2.8.4")
    ksp("androidx.room:room-compiler:2.8.4")
    implementation("androidx.room:room-ktx:2.8.4")

}
